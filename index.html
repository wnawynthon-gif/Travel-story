<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ef"><title>Travel Guide Engine v2.5</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header><div class="eyebrow">TRAVEL GUIDE ENGINE • v2.5</div><h1>Discover the place.<br>Find the story.</h1><p>Stories • Seasonal Spots • Photo • Food • Shopping • Streets & Areas • Maps • Social</p></header>
<section class="panel"><label>Destination</label><input id="city" placeholder="Seoul, London, Osaka, โซล, กรุงเทพ"><div class="row"><div><label>Area / Street (optional)</label><input id="area" placeholder="Hongdae, Soho, เยาวราช"></div><div><label>ภาษาผลลัพธ์ / Output</label><select id="lang"><option value="th" selected>ไทย</option><option value="en">English</option><option value="auto">ตามที่พิมพ์</option></select></div><div><label>Interest</label><select id="interest"><option value="auto">Auto Discover</option><option value="history">History</option><option value="hidden">Hidden Stories</option><option value="food">Food</option><option value="shopping">Shopping</option><option value="photo">Photo / Check-in</option><option value="family">Family Friendly</option></select></div></div>
<div class="modes"><button class="mode active" data-mode="all">Complete Guide</button><button class="mode" data-mode="story">Stories</button><button class="mode" data-mode="area">Area Guide</button></div><button id="go" class="primary">Create Travel Guide</button></section>
<nav id="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="stories">Stories</button><button data-tab="attractions">Attractions</button><button data-tab="food">Food</button><button data-tab="shopping">Shopping</button><button data-tab="route">Route</button><button data-tab="social">Social</button></nav>
<section class="panel result"><small id="status">READY</small><h2 id="title">Travel Guide Engine</h2><p id="intro">รวม Travel Story และ Area Guide ไว้ในแอปเดียว</p><div id="chips"></div><div id="content" class="empty">ใส่ชื่อเมือง (ไทยหรืออังกฤษก็ได้) แล้วกด Create Travel Guide</div><div class="actions"><button id="copy" hidden>Copy</button><button id="maps" hidden>Google Maps</button></div></section>
</main><script src="app.js"></script></body></html>
